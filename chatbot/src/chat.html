<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>n8n AI Workflow Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #ffffff;
      color: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 14px 16px 12px;
      background: #ff6d5a;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header-icon {
      width: 32px; height: 32px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header-title { font-weight: 600; font-size: 15px; }
    .header-sub  { font-size: 11px; opacity: 0.8; }
    .header-spacer { flex: 1; }
    #clear-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #clear-btn:hover { background: rgba(255,255,255,0.28); }
    .zoom-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .zoom-btn {
      min-width: 28px; height: 26px;
      padding: 2px 6px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 6px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .zoom-btn:hover { background: rgba(255,255,255,0.28); }
    #zoom-level { min-width: 40px; text-align: center; font-size: 11px; }

    .model-panel { padding: 10px 12px; background: #fff7f5; border-bottom: 1px solid #ffe0db; }
    .mode-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .mode-switch.two-mode { grid-template-columns: repeat(2, 1fr); }
    .mode-btn { border: 1px solid #f3c8c0; background: #fff; color: #8a3c31; border-radius: 8px; padding: 7px 5px; font: inherit; font-size: 12px; cursor: pointer; }
    .mode-btn.active { background: #ff6d5a; border-color: #ff6d5a; color: #fff; font-weight: 600; }
    /* Distinct from .mode-btn so the mode-switch click handler never attaches to it. */
    .solo-action-btn { border: 1px solid #f3c8c0; background: #fff; color: #8a3c31; border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 12px; cursor: pointer; }
    .solo-action-btn:hover { background: #fff2ef; }
    .solo-action-btn:disabled { opacity: .6; cursor: default; }
    .model-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: #6b4a45; }
    #model-select { min-width: 0; flex: 1; border: 1px solid #f3c8c0; border-radius: 6px; padding: 5px; background: #fff; font: inherit; }
    #mode-hint { margin-top: 7px; font-size: 11px; line-height: 1.35; color: #8a5a52; }

    /* Messages area */
    #messages {
      --chat-zoom: 1;
      flex: 1;
      min-height: 0; /* critical: lets this column shrink so .input-area stays visible (flex + overflow) */
      overflow-y: auto;
      padding: calc(16px * var(--chat-zoom)) calc(14px * var(--chat-zoom));
      display: flex;
      flex-direction: column;
      gap: calc(12px * var(--chat-zoom));
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 4px; }

    .bubble {
      max-width: 88%;
      padding: calc(10px * var(--chat-zoom, 1)) calc(13px * var(--chat-zoom, 1));
      border-radius: calc(14px * var(--chat-zoom, 1));
      line-height: 1.5;
      word-break: break-word;
      font-size: calc(13.5px * var(--chat-zoom, 1));
    }
    .bubble [style*="font-size"] {
      font-size: calc(12px * var(--chat-zoom, 1)) !important;
    }
    .bubble.user {
      align-self: flex-end;
      background: #ff6d5a;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.bot {
      align-self: flex-start;
      background: #f3f4f6;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }
    .bubble.bot.error {
      background: #fff0ee;
      color: #c0392b;
    }
    .bubble.bot a {
      color: #ff6d5a;
      font-weight: 600;
      text-decoration: none;
    }
    .bubble.bot a:hover { text-decoration: underline; }
    .conversation-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .conversation-actions button {
      border-radius: 8px;
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }
    .conv-confirm-btn { border: 0; background: #ff6d5a; color: #fff; }
    .conv-cancel-btn { border: 1px solid #f3c8c0; background: #fff; color: #8a3c31; }
    .conversation-actions button:disabled { opacity: .65; cursor: default; }

    /* Typing indicator */
    .typing {
      display: flex; gap: 5px; align-items: center;
      padding: 12px 14px;
      align-self: flex-start;
    }
    .typing span {
      width: 7px; height: 7px;
      background: #ccc; border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    .typing.progress {
      display: block;
      max-width: 88%;
      padding: 9px 12px;
      border: 1px solid #ffd1ca;
      border-radius: 7px;
      background: #fff7f5;
      color: #a14a3e;
      font-size: 12.5px;
      line-height: 1.45;
    }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.9); }
      40%            { opacity: 1;   transform: scale(1.1); }
    }

    /* Workflow JSON preview */
    .workflow-preview {
      margin-top: calc(8px * var(--chat-zoom, 1));
      background: #1a1a2e;
      color: #a8ff78;
      border-radius: calc(8px * var(--chat-zoom, 1));
      padding: calc(10px * var(--chat-zoom, 1)) calc(12px * var(--chat-zoom, 1));
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: calc(11px * var(--chat-zoom, 1));
      max-height: calc(160px * var(--chat-zoom, 1));
      overflow-y: auto;
      white-space: pre;
    }

    /* Input area */
    .input-area {
      padding: 12px 12px 14px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    #input {
      flex: 1;
      resize: none;
      border: 1px solid #e0e0e0;
      border-radius: calc(10px * var(--chat-zoom, 1));
      padding: calc(9px * var(--chat-zoom, 1)) calc(12px * var(--chat-zoom, 1));
      font-size: calc(13.5px * var(--chat-zoom, 1));
      font-family: inherit;
      line-height: 1.45;
      max-height: calc(100px * var(--chat-zoom, 1));
      outline: none;
      transition: border-color 0.15s;
    }
    #input:focus { border-color: #ff6d5a; }
    #send-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: #ff6d5a;
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #e85d4a; }
    #send-btn:disabled { background: #f0a899; cursor: not-allowed; }
    #send-btn svg { pointer-events: none; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">⚡</div>
    <div>
      <div class="header-title">AI Workflow Generator</div>
      <div class="header-sub" id="header-sub">建立與畫布編輯使用獨立模型</div>
    </div>
    <div class="header-spacer"></div>
    <div class="zoom-controls" role="group" aria-label="聊天文字大小">
      <button id="zoom-out" class="zoom-btn" type="button" title="縮小聊天內容" aria-label="縮小">A−</button>
      <output id="zoom-level" aria-live="polite">100%</output>
      <button id="zoom-in" class="zoom-btn" type="button" title="放大聊天內容" aria-label="放大">A+</button>
    </div>
    <button id="clear-btn" title="清空對話">清空</button>
  </div>

  <div class="model-panel">
    <div class="mode-switch" role="tablist" aria-label="工作模式">
      <button class="mode-btn active" type="button" data-mode="create">建立 workflow</button>
      <button class="mode-btn" type="button" data-mode="compiler">Compiler Beta</button>
      <button class="mode-btn" type="button" data-mode="edit">插入／刪除／修改</button>
    </div>
    <label class="model-row" id="model-row">模型<select id="model-select" aria-label="選擇模型"></select></label>
    <div id="mode-hint">從零建立新 workflow；不會讀取或修改目前畫布。</div>
    <div id="solo-actions" hidden>
      <button id="solo-cal-chip" class="solo-action-btn" type="button">📅 讀取我的 Google 日曆</button>
    </div>
  </div>

  <div id="messages">
    <div class="bubble bot">
      👋 選擇上方的工作模式後，描述你想完成的事情。建立與畫布編輯會使用各自獨立的模型清單。
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="描述你想要的 workflow…"></textarea>
    <button type="button" id="send-btn" title="送出">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <script>
    var AGENT_URL = window.location.origin + '/agent/run';
    var GENERATE_URL = window.location.origin + '/generate';
    var COMPILER_URL = window.location.origin + '/beta/compile';
    // Plan-first (guarded nodewise compiler) endpoints — Compiler Beta mode uses these.
    var PLAN_REQUEST_URL = window.location.origin + '/beta/plan-from-request';
    var PLAN_APPROVE_URL = window.location.origin + '/beta/plan-approve';
    var COMPILE_APPROVED_URL = window.location.origin + '/beta/compile-approved';
    // Solo-only Google Calendar read skill (gated by SOLO_CREDENTIAL_MODE server-side).
    var SOLO_CALENDAR_URL = window.location.origin + '/beta/solo/calendar-read';
    // Conversational plan flow (Compiler Beta mode).
    var CONV_START_URL = window.location.origin + '/beta/conversation/start';
    var CONV_MESSAGE_URL = window.location.origin + '/beta/conversation/message';
    var CONV_CONFIRM_URL = window.location.origin + '/beta/conversation/confirm';
    var CONV_CANCEL_URL = window.location.origin + '/beta/conversation/cancel';
    var HISTORY_KEY = 'n8n-widget-history';
    var SESSION_KEY = 'n8n-widget-agent-session';
    var MODE_KEY = 'n8n-widget-active-mode';
    var ZOOM_KEY = 'n8n-widget-chat-zoom';
    var WIDGET_MSG_TYPE = 'n8n-ai-widget';
    var MODELS_URL = window.location.origin + '/models';
    // Edit sessions can span iframe reloads. Restore their mode so a pending
    // clarification is never accidentally sent to the Create endpoint.
    var activeMode = (function () {
      try {
        if (localStorage.getItem(SESSION_KEY)) return 'edit';
        var savedMode = localStorage.getItem(MODE_KEY);
        return ['edit', 'compiler'].includes(savedMode) ? savedMode : 'create';
      } catch (e) {
        return 'create';
      }
    })();
    // The fallback prevents an empty selector when a reverse proxy exposes
    // /chat but has not yet exposed /models. The server still validates every
    // submitted model against its configured allow-list.
    var modelConfig = {
      create: { models: ['qwen2.5-coder-32b-ft-original:latest'], defaultModel: 'qwen2.5-coder-32b-ft-original:latest' },
      edit: { models: ['gpt-4o', 'gpt-oss:120b'], defaultModel: 'gpt-4o' },
      compiler: { models: [], defaultModel: '' },
      compilerBeta: { enabled: false, standalone: false, supportedPatterns: [] }
    };

    var messagesEl = document.getElementById('messages');
    var inputEl    = document.getElementById('input');
    var sendBtn    = document.getElementById('send-btn');
    var clearBtn   = document.getElementById('clear-btn');
    var modelSelect = document.getElementById('model-select');
    var modelRow = document.getElementById('model-row');
    var modeHint = document.getElementById('mode-hint');
    var zoomOutBtn = document.getElementById('zoom-out');
    var zoomInBtn = document.getElementById('zoom-in');
    var zoomLevelEl = document.getElementById('zoom-level');
    var soloActions = document.getElementById('solo-actions');
    var soloCalChip = document.getElementById('solo-cal-chip');
    var soloCalendarEnabled = false;
    var conversationId = null; // active Compiler Beta conversation (null = none yet)

    var CHAT_ZOOM_LEVELS = [0.8, 0.9, 1, 1.1, 1.25, 1.5];
    var chatZoomIndex = 2;

    function applyChatZoom(index) {
      chatZoomIndex = Math.max(0, Math.min(CHAT_ZOOM_LEVELS.length - 1, index));
      var zoom = CHAT_ZOOM_LEVELS[chatZoomIndex];
      messagesEl.style.setProperty('--chat-zoom', String(zoom));
      if (zoomLevelEl) zoomLevelEl.textContent = Math.round(zoom * 100) + '%';
      if (zoomOutBtn) zoomOutBtn.disabled = chatZoomIndex === 0;
      if (zoomInBtn) zoomInBtn.disabled = chatZoomIndex === CHAT_ZOOM_LEVELS.length - 1;
      try { localStorage.setItem(ZOOM_KEY, String(zoom)); } catch (e) {}
    }

    function restoreChatZoom() {
      var saved = null;
      try { saved = Number.parseFloat(localStorage.getItem(ZOOM_KEY)); } catch (e) {}
      var index = CHAT_ZOOM_LEVELS.indexOf(saved);
      applyChatZoom(index >= 0 ? index : 2);
    }

    if (zoomOutBtn) zoomOutBtn.addEventListener('click', function () { applyChatZoom(chatZoomIndex - 1); });
    if (zoomInBtn) zoomInBtn.addEventListener('click', function () { applyChatZoom(chatZoomIndex + 1); });
    restoreChatZoom();

    function greeting() {
      return activeMode === 'create'
        ? '👋 描述你想從零建立的 workflow。<br><br>範例：<em>「每天早上 9 點把 Airtable 資料寄到 Slack」</em>'
        : activeMode === 'compiler'
          ? '👋 用自然語言描述你想要的 workflow，我會跟你討論、逐步把計畫談清楚；你可以隨時說「再加一步」「這裡改成…」。計畫談定後按「✅ 確認並建立」就會生成到 n8n 畫布，之後可在畫布上再增刪節點。不支援的需求我會明確說明，不會硬生 workflow。<br><br>範例：<em>「抓 user 1 的 todos，依 id 排序取前 5 筆，回報總數與未完成數」</em>'
        : '👋 描述要對 <strong>目前開啟的 workflow</strong> 做的插入、刪除或修改。<br><br>範例：<em>「在 HTTP Request 後面加一個 Set」</em>、<em>「刪掉用不到的 Code 節點」</em>';
    }

    function renderModelOptions() {
      var group = modelConfig[activeMode] || {};
      var models = group.models || [];
      modelSelect.innerHTML = '';
      models.forEach(function (model) {
        var option = document.createElement('option'); option.value = model; option.textContent = model; modelSelect.appendChild(option);
      });
      if (group.defaultModel) modelSelect.value = group.defaultModel;
      modelSelect.disabled = models.length === 0;
      modelRow.hidden = activeMode === 'compiler';
      if (soloActions) soloActions.hidden = !(activeMode === 'compiler' && soloCalendarEnabled);
      modeHint.textContent = activeMode === 'create'
        ? '從零建立新 workflow；不會讀取或修改目前畫布。'
        : activeMode === 'compiler'
          ? '跟 AI 對話把計畫談定 → 按「確認並建立」生成到畫布（受驗證技能組合，未支援需求明確拒絕）。'
        : '對目前畫布進行插入、刪除或修改；需要先開啟目標 workflow。';
    }

    function switchMode(mode) {
      if (mode === 'create' && loadSessionId()) {
        modeHint.textContent = '目前有未完成的畫布編輯追問；請先完成或按「清空」再建立新的 workflow。';
        return;
      }
      activeMode = mode;
      conversationId = null; // each Compiler Beta session starts a fresh conversation
      try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
      document.querySelectorAll('.mode-btn').forEach(function (button) { button.classList.toggle('active', button.dataset.mode === mode); });
      renderModelOptions();
    }

    document.querySelectorAll('.mode-btn').forEach(function (button) { button.addEventListener('click', function () { switchMode(button.dataset.mode); }); });
    if (soloCalChip) soloCalChip.addEventListener('click', createSoloCalendar);
    switchMode(activeMode);
    fetch(MODELS_URL).then(function (res) { return res.ok ? res.json() : null; }).then(function (config) {
      if (!config) return;
      modelConfig = config;
      soloCalendarEnabled = !!(config.soloSkills && config.soloSkills.calendarRead);
      if (config.compilerBeta && config.compilerBeta.standalone) {
        var createButton = document.querySelector('[data-mode="create"]');
        if (createButton) createButton.textContent = 'Fine-tuned Create';
        var editButton = document.querySelector('[data-mode="edit"]');
        if (editButton) editButton.hidden = true;
        document.querySelector('.mode-switch').classList.add('two-mode');
        document.getElementById('header-sub').textContent = 'Fine-tuned Create 與 Runtime Compiler Beta';
      }
      var compilerButton = document.querySelector('[data-mode="compiler"]');
      if (compilerButton) compilerButton.disabled = !(config.compilerBeta && config.compilerBeta.enabled);
      if (activeMode === 'compiler' && !(config.compilerBeta && config.compilerBeta.enabled)) activeMode = 'create';
      renderModelOptions();
    }).catch(function () { renderModelOptions(); });

    function currentWorkflowId() {
      var q = new URLSearchParams(window.location.search || '');
      var w = q.get('workflowId');
      return w && String(w).trim() ? String(w).trim() : null;
    }

    function notifyParentCanvasRefresh(workflow) {
      return new Promise(function (resolve) {
        if (!window.parent || window.parent === window || !workflow) {
          resolve({ ok: false, reason: 'skip' });
          return;
        }
        var id = workflow.id || workflow.workflowId;
        if (!id) {
          resolve({ ok: false, reason: 'no_id' });
          return;
        }
        var openId = currentWorkflowId();
        if (openId && String(openId) !== String(id)) {
          resolve({ ok: false, reason: 'mismatch' });
          return;
        }

        var requestId = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        var settled = false;
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          window.removeEventListener('message', onRefreshResult);
          resolve({ ok: false, reason: 'timeout' });
        }, 8000);

        function onRefreshResult(event) {
          if (!event.data || typeof event.data !== 'object') return;
          if (event.data.type !== WIDGET_MSG_TYPE) return;
          if (event.data.action !== 'refreshCanvasResult') return;
          if (event.data.requestId !== requestId) return;
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          window.removeEventListener('message', onRefreshResult);
          resolve({
            ok: !!event.data.ok,
            method: event.data.method,
            reason: event.data.reason,
          });
        }

        window.addEventListener('message', onRefreshResult);
        try {
          window.parent.postMessage({
            type: WIDGET_MSG_TYPE,
            action: 'refreshCanvas',
            requestId: requestId,
            payload: { workflowId: id, workflow: workflow },
          }, '*');
        } catch (e) {
          clearTimeout(timer);
          window.removeEventListener('message', onRefreshResult);
          resolve({ ok: false, reason: 'postMessage_failed' });
        }
      });
    }

    function canvasRefreshNote(refreshResult) {
      if (!refreshResult || refreshResult.ok) return '';
      if (refreshResult.reason === 'mismatch' || refreshResult.reason === 'skip') return '';
      return '<br><span style="font-size:12px;opacity:0.75;color:#b45309;">（若畫布沒有更新，請從左側重新點選此 workflow。）</span>';
    }

    function formatBotReply(message, refreshResult) {
      var text = escHtml(message || '完成').replace(/\n/g, '<br>');
      text += canvasRefreshNote(refreshResult);
      return text;
    }

    function loadSessionId() {
      try { return localStorage.getItem(SESSION_KEY) || null; } catch (e) { return null; }
    }
    function saveSessionId(id) {
      if (!id) return;
      try { localStorage.setItem(SESSION_KEY, id); } catch (e) {}
    }

    // -----------------------------------------------------------------
    // Chat history persistence via sessionStorage
    // -----------------------------------------------------------------
    var chatHistory = [];

    function saveHistory() {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(chatHistory)); } catch(e) {}
    }

    function restoreHistory() {
      try {
        var saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        if (!Array.isArray(saved) || saved.length === 0) return;
        // Remove the default greeting before restoring
        messagesEl.innerHTML = '';
        saved.forEach(function(item) {
          addBubble(item.html, item.type, true); // true = skip saving again
        });
        chatHistory = saved;
      } catch(e) {}
    }

    // -----------------------------------------------------------------

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addBubble(html, type, skipSave) {
      var el = document.createElement('div');
      el.className = 'bubble ' + type;
      el.innerHTML = html;
      messagesEl.appendChild(el);
      scrollBottom();
      if (!skipSave) {
        chatHistory.push({ html: html, type: type });
        saveHistory();
      }
      return el;
    }

    function addTyping() {
      var el = document.createElement('div');
      el.className = 'typing';
      el.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(el);
      scrollBottom();
      return el;
    }

    function setProgress(typing, message) {
      typing.className = 'typing progress';
      typing.textContent = message;
      scrollBottom();
    }

    async function generateWithProgress(body, typing) {
      body.stream = true;
      var res = await fetch(GENERATE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      var contentType = res.headers.get('content-type') || '';
      if (!contentType.includes('application/x-ndjson') || !res.body) {
        return { ok: res.ok, data: await res.json() };
      }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var result = null;
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop();
        lines.forEach(function(line) {
          if (!line.trim()) return;
          var event = JSON.parse(line);
          if (event.event === 'progress') setProgress(typing, event.message || 'Processing...');
          if (event.event === 'result') result = event;
        });
      }
      if (!result) throw new Error('Server did not return a Create result');
      return { ok: result.status >= 200 && result.status < 300, data: result.data };
    }

    // Auto-grow textarea
    inputEl.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    async function send() {
      var text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      addBubble(escHtml(text), 'user');

      var typing = addTyping();

      try {
        var useCreate = activeMode === 'create';
        var useCompiler = activeMode === 'compiler';
        var wfId = (useCreate || useCompiler) ? null : currentWorkflowId();
        var res;
        var data;
        if (useCompiler) {
          // Compiler Beta = conversational plan flow: start a conversation on the
          // first message, then continue it. Rendering + Confirm/Cancel happen below.
          var convResp = conversationId
            ? await postJson(CONV_MESSAGE_URL, { conversationId: conversationId, message: text })
            : await postJson(CONV_START_URL, { message: text });
          res = { ok: convResp.ok };
          data = convResp.data;
        } else if (useCreate) {
          var body = { message: text, model: modelSelect.value };
          var generated = await generateWithProgress(body, typing);
          res = { ok: generated.ok };
          data = generated.data;
        } else {
          res = await fetch(AGENT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, sessionId: loadSessionId(), workflowId: wfId, clearSession: false, model: modelSelect.value }),
          });
          data = await res.json();
        }
        typing.remove();

        if (useCompiler) {
          renderConversationTurn(data, res.ok);
          return;
        }

        if (!res.ok || data.error) {
          var errMsg = data.error || 'Unknown error';
          if (data.sessionId) saveSessionId(data.sessionId);
          var errHtml = '❌ ' + escHtml(errMsg);
          if (data.workflow) {
            errHtml += '<div class="workflow-preview">' + escHtml(JSON.stringify(data.workflow, null, 2)) + '</div>';
          }
          addBubble(errHtml, 'bot error');
        } else if (data.action === 'clarify') {
          var cands = data.candidates && data.candidates.length
            ? '<br><br>候選：<em>' + escHtml(data.candidates.join(', ')) + '</em>'
            : '';
          saveSessionId(data.sessionId);
          // A clarification belongs to the edit pipeline even after an iframe reload.
          activeMode = 'edit';
          try { localStorage.setItem(MODE_KEY, activeMode); } catch (e) {}
          document.querySelectorAll('.mode-btn').forEach(function (button) { button.classList.toggle('active', button.dataset.mode === 'edit'); });
          renderModelOptions();
          addBubble('❓ ' + escHtml(data.message || '') + cands, 'bot');
        } else if (data.action === 'done') {
          saveSessionId(null);
          try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
          var refreshResult = data.workflow
            ? await notifyParentCanvasRefresh(data.workflow)
            : null;
          addBubble(formatBotReply(data.message, refreshResult), 'bot');
        } else if (useCreate) {
          var htmlQ = escHtml(data.message || '已建立 workflow。').replace(/\n/g, '<br>');
          if (data.workflowUrl) {
            htmlQ += '<br><br><a href="' + escHtml(data.workflowUrl) + '" target="_parent">→ 在 n8n 中開啟 workflow</a>';
          }
          addBubble(htmlQ, 'bot');
        } else {
          saveSessionId(data.sessionId);
          addBubble(formatBotReply(data.message || '已處理', null), 'bot');
        }
      } catch (err) {
        typing.remove();
        addBubble('❌ 無法連線到 chatbot 服務：' + escHtml(err.message), 'bot error');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // --- Plan-first (Compiler Beta) helpers ---------------------------------
    // POST JSON and always resolve to { ok, status, data } even on non-JSON.
    function postJson(url, body) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          return { ok: res.ok, status: res.status, data: data };
        });
      });
    }

    // Plans awaiting user confirmation, keyed by an id carried on the button.
    // Not persisted: a plan bubble restored from history is intentionally inert.
    var pendingPlans = {};

    function renderPlanFirstReview(data, httpOk) {
      data = data || {};
      if (data.error || !httpOk) {
        var msg = data.error || ('規劃失敗 (HTTP ' + (data.status || '?') + ')');
        if (data.code === 'plan_first_planner_timeout' || /timeout/i.test(String(data.error || ''))) {
          msg = '規劃逾時（模型可能在冷啟動），請再送一次。';
        }
        addBubble('❌ ' + escHtml(msg), 'bot error');
        return;
      }
      var outcome = data.outcome;
      if (outcome === 'clarification_required') {
        var needs = (data.requiredUserInputs || []).map(escHtml).join('、');
        addBubble('❓ ' + escHtml(data.goal || '需要更多資訊才能規劃') + (needs ? '<br>請補充：<em>' + needs + '</em>' : ''), 'bot');
        return;
      }
      if (outcome === 'unsupported_capability') {
        var gap = data.capabilityGap || {};
        var gaps = (data.capabilityGaps || gap.requestedSkillIds || []).map(escHtml).join('、');
        addBubble('🚫 目前不支援此需求' + (gaps ? '：' + gaps : '')
          + '<br><span style="font-size:11px;opacity:.75">系統只用已驗證的技能組合，不會硬生一個跑不動的 workflow。</span>', 'bot');
        return;
      }
      if (data.specification && (data.plan || outcome === 'review_required' || outcome === 'ready_to_compile')) {
        var planId = 'plan_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        pendingPlans[planId] = { specification: data.specification, sessionId: 'ui-' + planId };
        var plan = data.plan || {};
        var stepSrc = plan.steps || data.specification.steps || [];
        var steps = stepSrc.map(function (s) {
          var op = s.operation || (s.configuration && s.configuration.operation) || s.capability || s.kind || '?';
          return '<li>' + escHtml(op) + '</li>';
        }).join('');
        var fields = ((data.specification.expectedOutput && data.specification.expectedOutput.fields) || []).map(escHtml).join(', ');
        var goal = (plan.goal || data.specification.goal || '').trim();
        // Disclosures the backend already computed — the user confirms with full
        // sight of where data goes and what setup / side effects are involved.
        var domains = (plan.externalDomains || []).map(escHtml).join(', ');
        var setup = (plan.setupRequirements || []).map(escHtml).join('、');
        var effects = (plan.sideEffects || []).map(escHtml).join('、');
        var meta = 'font-size:12px;opacity:.8';
        var html = '📋 <b>規劃出的步驟</b>（先看再建）'
          + (goal ? '<div style="' + meta + ';margin:2px 0 4px">' + escHtml(goal) + '</div>' : '')
          + '<ol style="margin:6px 0 6px 18px;padding:0">' + steps + '</ol>'
          + (fields ? '<div style="' + meta + '">輸出欄位：' + fields + '</div>' : '')
          + '<div style="' + meta + '">資料來源：' + (domains || '無外部連線') + '</div>'
          + (setup ? '<div style="' + meta + '">⚙️ 需要你先設定：' + setup + '</div>' : '')
          + (effects ? '<div style="font-size:12px;color:#c0392b;font-weight:600;margin-top:2px">⚠️ 副作用：' + effects + '</div>' : '')
          + '<button class="plan-approve-btn" data-plan="' + planId + '" style="margin-top:8px;background:#ff6d5a;color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer">✅ 建立此 workflow</button>';
        var el = addBubble(html, 'bot', true); // skipSave: button handler can't survive a reload
        var btn = el.querySelector('.plan-approve-btn');
        if (btn) btn.addEventListener('click', function () { approvePlan(planId, btn); });
        return;
      }
      addBubble('⚠️ 規劃器回傳了未預期的結果，請再試一次或換個描述。', 'bot error');
    }

    async function approvePlan(planId, btn) {
      var plan = pendingPlans[planId];
      if (!plan) { addBubble('⚠️ 這個規劃已失效，請重新描述需求。', 'bot error'); return; }
      if (btn) { btn.disabled = true; btn.textContent = '建立中…'; }
      var typing = addTyping();
      function fail(m) {
        typing.remove();
        addBubble('❌ ' + escHtml(m), 'bot error');
        if (btn) { btn.disabled = false; btn.textContent = '✅ 建立此 workflow'; }
      }
      try {
        var ap = await postJson(PLAN_APPROVE_URL, { specification: plan.specification, approved: true, sessionId: plan.sessionId });
        if (!ap.ok || !ap.data || !ap.data.approvalToken) {
          return fail('核准失敗：' + ((ap.data && ap.data.error) || ('HTTP ' + ap.status)));
        }
        var cm = await postJson(COMPILE_APPROVED_URL, { specification: plan.specification, approvalToken: ap.data.approvalToken, sessionId: plan.sessionId });
        if (!cm.ok || !cm.data || cm.data.error) {
          return fail('建立失敗：' + ((cm.data && cm.data.error) || ('HTTP ' + cm.status)));
        }
        delete pendingPlans[planId];
        typing.remove();
        if (btn) { btn.textContent = '✅ 已建立'; }
        var wf = cm.data.workflow;
        var wfId = cm.data.workflowId || (wf && (wf.id || wf.workflowId));
        var okHtml = '🎉 已建立 workflow' + (wfId ? '（id: ' + escHtml(String(wfId)) + '）' : '') + '。';
        var refresh = wf ? await notifyParentCanvasRefresh(wf) : { ok: false };
        if (cm.data.workflowUrl) {
          okHtml += '<br><a href="' + escHtml(cm.data.workflowUrl) + '" target="_parent">→ 在 n8n 中開啟</a>';
        } else if (!(refresh && refresh.ok)) {
          okHtml += '<br>請在 n8n 開啟此 workflow 並手動 Execute 查看結果。';
        }
        addBubble(okHtml, 'bot');
      } catch (err) {
        fail('無法連線到 chatbot 服務：' + err.message);
      }
    }

    // --- Solo Google Calendar read skill (quick action + credential guidance) ---
    async function createSoloCalendar() {
      if (soloCalChip) soloCalChip.disabled = true;
      addBubble('📅 建立「讀取我的 Google 日曆」workflow…', 'user');
      var typing = addTyping();
      try {
        var resp = await postJson(SOLO_CALENDAR_URL, { limit: 10 });
        typing.remove();
        renderSoloCredentialGuidance(resp.data, resp.ok);
      } catch (err) {
        typing.remove();
        addBubble('❌ 無法連線到 chatbot 服務：' + escHtml(err.message), 'bot error');
      } finally {
        if (soloCalChip) soloCalChip.disabled = false;
      }
    }

    function renderSoloCredentialGuidance(data, httpOk) {
      data = data || {};
      if (!httpOk || data.error) {
        addBubble('❌ ' + escHtml(data.error || ('建立失敗 (HTTP ' + (data.status || '?') + ')')), 'bot error');
        return;
      }
      var reqs = (data.setupManifest && data.setupManifest.credentialRequirements) || [];
      var credLine = reqs.map(function (r) { return escHtml(r.displayName || r.credentialType); }).join('、') || 'Google Calendar 憑證';
      var wfUrl = data.workflowUrl;
      var openStep = wfUrl
        ? '<a href="' + escHtml(wfUrl) + '" target="_parent">在 n8n 開啟這個 workflow</a>'
        : '在 n8n 開啟這個 workflow';
      var html = '🎉 已建立「讀取 Google 日曆」workflow（<b>停用草稿</b>，尚未啟用）。'
        + '<br><br>⚠️ 此 workflow 需要你連接：<b>' + credLine + '</b>'
        + '<br><br>完成以下步驟即可使用：'
        + '<ol style="margin:6px 0 6px 18px;padding:0">'
        + '<li>' + openStep + '</li>'
        + '<li>點「List Calendar Events」節點 → 選擇（或新增）你自己的 Google 帳號憑證</li>'
        + '<li>選擇要讀取的日曆 → 儲存（Save）</li>'
        + '<li>按 Activate 啟用（系統刻意先建成停用草稿，不會自動啟用）</li>'
        + '<li>按 Execute 執行，即可看到你的日曆活動</li>'
        + '</ol>';
      addBubble(html, 'bot', true);
      if (data.workflow) notifyParentCanvasRefresh(data.workflow);
    }

    // --- Conversational plan flow (Compiler Beta) ---------------------------
    function renderPlanTextHtml(spec, credentials) {
      var steps = ((spec && spec.steps) || []).map(function (s) {
        var op = (s.configuration && s.configuration.operation) || s.capability || '?';
        return '<li>' + escHtml(op) + '</li>';
      }).join('');
      var goal = escHtml((spec && spec.goal) || '');
      var fields = (((spec && spec.expectedOutput) || {}).fields || []).map(escHtml).join(', ');
      var meta = 'font-size:12px;opacity:.8';
      var credLine = (credentials && credentials.length)
        ? '<div style="' + meta + '">需要憑證：' + credentials.map(function (c) { return escHtml(c.credentialType) + '（' + escHtml(c.status) + '）'; }).join('、') + '</div>'
        : '';
      return '📋 <b>目前的計畫</b>'
        + (goal ? '<div style="' + meta + ';margin:2px 0">' + goal + '</div>' : '')
        + '<ol style="margin:6px 0 6px 18px;padding:0">' + steps + '</ol>'
        + (fields ? '<div style="' + meta + '">輸出欄位：' + fields + '</div>' : '')
        + credLine;
    }

    function conversationActionHtml() {
      return '<div class="conversation-actions">'
        + '<button class="conv-confirm-btn" type="button">✅ 確認並建立</button>'
        + '<button class="conv-cancel-btn" type="button">取消</button>'
        + '</div>';
    }

    function wireConversationActions(element) {
      if (!element) return;
      var cb = element.querySelector('.conv-confirm-btn');
      if (cb) cb.addEventListener('click', function () { confirmConversation(cb); });
      var xb = element.querySelector('.conv-cancel-btn');
      if (xb) xb.addEventListener('click', cancelConversation);
    }

    function renderConversationTurn(data, httpOk) {
      data = data || {};
      if (!httpOk || data.error) {
        var msg = data.code === 'conversation_planner_timeout' ? '規劃逾時（模型可能在載入中），請再送一次。'
          : data.error === 'credential_choice_required' ? '這個計畫需要你選擇要用哪個憑證（選擇介面稍後提供）。'
          : data.error === 'not_ready_to_confirm' ? '計畫還沒準備好，請先把需求談清楚。'
          : (typeof data.error === 'string' ? data.error : '對話發生問題，請再試一次。');
        addBubble('⚠️ ' + escHtml(msg), 'bot error');
        return;
      }
      if (data.conversationId) conversationId = data.conversationId;
      if (data.assistantMessage) addBubble(escHtml(data.assistantMessage), 'bot');
      var view = data.view || {};
      var ready = view.status === 'ready_to_confirm';
      var planElement = view.planSpec
        ? addBubble(renderPlanTextHtml(view.planSpec, view.credentials) + (ready ? conversationActionHtml() : ''), 'bot', true)
        : null;
      if (ready) {
        // Keep actions in the same bubble as the newly rendered plan so every
        // successful refinement visibly has Confirm and Cancel controls.
        if (!planElement) planElement = addBubble(conversationActionHtml(), 'bot', true);
        wireConversationActions(planElement);
      } else if (view.status === 'awaiting_credential_choice') {
        addBubble('這個計畫有多個可用憑證，需要你選擇（選擇介面稍後提供）。', 'bot');
      }
    }

    async function confirmConversation(btn) {
      if (!conversationId) return;
      if (btn) { btn.disabled = true; btn.textContent = '建立中…'; }
      var typing = addTyping();
      try {
        var resp = await postJson(CONV_CONFIRM_URL, { conversationId: conversationId });
        typing.remove();
        var d = resp.data || {};
        var result = d.result || {};
        var payload = result.payload || {};
        if (!resp.ok || d.error || (result.status && result.status !== 200)) {
          var m = d.error === 'credential_choice_required' ? '需要先選擇憑證。'
            : d.error === 'not_ready_to_confirm' ? '計畫還沒準備好。'
            : payload.error || (typeof d.error === 'string' ? d.error : '建立失敗，請再試一次。');
          addBubble('❌ ' + escHtml(m), 'bot error');
          if (btn) { btn.disabled = false; btn.textContent = '✅ 確認並建立'; }
          return;
        }
        var wf = payload.workflow;
        var wfId = payload.workflowId || (wf && (wf.id || wf.workflowId));
        var okHtml = '🎉 已建立 workflow' + (wfId ? '（id: ' + escHtml(String(wfId)) + '）' : '') + '。';
        var refresh = wf ? await notifyParentCanvasRefresh(wf) : { ok: false };
        if (payload.workflowUrl) okHtml += '<br><a href="' + escHtml(payload.workflowUrl) + '" target="_parent">→ 在 n8n 中開啟</a>';
        else if (!(refresh && refresh.ok)) okHtml += '<br>請在 n8n 開啟此 workflow 並手動 Execute。';
        addBubble(okHtml, 'bot');
        conversationId = null; // conversation complete
      } catch (err) {
        typing.remove();
        addBubble('❌ 無法連線到 chatbot 服務：' + escHtml(err.message), 'bot error');
        if (btn) { btn.disabled = false; btn.textContent = '✅ 確認並建立'; }
      }
    }

    async function cancelConversation() {
      if (!conversationId) return;
      try { await postJson(CONV_CANCEL_URL, { conversationId: conversationId }); } catch (e) {}
      addBubble('已取消建立。可以繼續告訴我要怎麼調整計畫。', 'bot');
      // keep conversationId — the conversation returns to planning, not discarded
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    sendBtn.addEventListener('click', send);

    clearBtn.addEventListener('click', function () {
      chatHistory = [];
      conversationId = null; // drop any active Compiler Beta conversation
      try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
      messagesEl.innerHTML = '<div class="bubble bot">' + greeting() + '</div>';
    });

    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // Restore history on load (survives iframe recreation)
    restoreHistory();
  </script>
</body>
</html>
